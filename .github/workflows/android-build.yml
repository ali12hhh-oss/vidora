name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK and refresh dependency verification metadata
        run: ./gradlew :app:assembleDebug --write-verification-metadata sha256 --stacktrace --no-daemon

      - name: Upload refreshed verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: vidora-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vidora-arm64-v8a-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
